services:
  # 1. FastAPI Backend API Service
  - type: web
    name: brandguard-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: brandguard-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: AI_PROVIDER
        value: rule_fallback
      - key: DEMO_MODE
        value: "true"

  # 2. Next.js Frontend UI Service
  - type: web
    name: brandguard-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    region: oregon
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: brandguard-backend
          property: host

databases:
  - name: brandguard-db
    plan: free
    region: oregon
